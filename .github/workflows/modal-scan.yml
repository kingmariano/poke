name: modal-scan

on:
  workflow_dispatch:
    inputs:
      task:
        description: "selftest | campaign_init | campaign | campaign_status"
        default: "selftest"
      campaign:
        description: "campaign name (scanner/campaigns/<name>.json)"
        default: "demo"
      max_shards:
        description: "maximum shards to execute in this run"
        default: "1"
      budget_seconds:
        description: "per-shard time budget (seconds)"
        default: "120"

permissions:
  contents: read

concurrency:
  group: modal-scan
  cancel-in-progress: false

jobs:
  modal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Modal client
        run: pip install modal z3-solver
      - name: Run on Modal GPU
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          python -m modal run scanner/modal_scan.py::main \
            --task "${{ inputs.task }}" \
            --campaign "${{ inputs.campaign }}" \
            --max-shards "${{ inputs.max_shards }}" \
            --budget-seconds "${{ inputs.budget_seconds }}"
